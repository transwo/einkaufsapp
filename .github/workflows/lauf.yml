# Einkaufsapp - holt jede Nacht die Angebote und legt die Seite auf
# GitHub Pages (https://transwo.github.io/einkaufsapp/).
# Die Zeit steht in UTC: 3 Uhr UTC = 5 Uhr in Dresden (Sommerzeit).
name: Angebote holen

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v6
      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bibliotheken installieren
        run: python -m pip install --quiet curl_cffi beautifulsoup4
      - name: Angebote holen
        env:
          TZ: Europe/Berlin
          MARKTGURU_APIKEY: ${{ secrets.MARKTGURU_APIKEY }}
          MARKTGURU_CLIENTKEY: ${{ secrets.MARKTGURU_CLIENTKEY }}
        run: python hole.py
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp index.html bericht.txt angebote.json _site/ || true
          test -f _site/index.html || echo "<p>Lauf ohne Seite - siehe bericht.txt</p>" > _site/index.html
      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  lebenszeichen:
    # GitHub schaltet zeitgesteuerte Laeufe in oeffentlichen Repositorys
    # ab, wenn 60 Tage lang nichts ins Repository geschrieben wurde.
    # Ist der letzte Eintrag 50 Tage oder aelter, schreibt dieser Schritt
    # das Datum in lebenszeichen.txt. Sonst tut er nichts.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Dateien holen
        uses: actions/checkout@v6
      - name: Lebenszeichen schreiben, falls noetig
        run: |
          letzter=$(git log -1 --format=%ct)
          jetzt=$(date +%s)
          tage=$(( (jetzt - letzter) / 86400 ))
          echo "Letzter Eintrag vor $tage Tagen"
          if [ "$tage" -ge 50 ]; then
            TZ=Europe/Berlin date +"%d.%m.%Y" > lebenszeichen.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lebenszeichen.txt
            git commit -m "Lebenszeichen, damit GitHub den naechtlichen Lauf nicht abschaltet"
            git push
          else
            echo "Nichts zu tun"
          fi

  veroeffentlichen:
    needs: holen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.seite.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages legen
        id: seite
        uses: actions/deploy-pages@v4
