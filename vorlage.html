<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Angebote">
<title>Angebote</title>
<style>
:root{
  --bg:#f6f6f4; --karte:#ffffff; --text:#1b1b1a; --grau:#6b6b66;
  --linie:#e2e2dd; --akzent:#1f6f3f; --warn:#8a5a00; --feld:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --karte:#202227; --text:#ecedee; --grau:#9b9ea3;
         --linie:#2e3138; --akzent:#5fbe86; --warn:#d7a53c; --feld:#25282e; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 16px 64px; max-width:1100px; margin:0 auto;
  -webkit-text-size-adjust:100%;
}
header{position:sticky; top:0; background:var(--bg); padding:14px 0 10px; z-index:10}
h1{font-size:26px; margin:0 0 2px; letter-spacing:-.01em}
.stand{color:var(--grau); font-size:14px; margin-bottom:12px}
#suche,#eigen{
  width:100%; padding:14px 16px; font-size:19px; border-radius:12px;
  border:1px solid var(--linie); background:var(--feld); color:var(--text);
  -webkit-appearance:none;
}
#suche:focus,#eigen:focus{outline:2px solid var(--akzent); outline-offset:-1px}
.maerkte{display:flex; flex-wrap:wrap; gap:7px; margin:11px 0 4px}
.chip{
  padding:6px 13px; border-radius:999px; border:1px solid var(--linie);
  background:var(--karte); color:var(--grau); font-size:14px; cursor:pointer;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.chip.an{background:var(--akzent); border-color:var(--akzent); color:#fff; font-weight:600}
.hinweis{color:var(--grau); font-size:14px; padding:26px 2px}
#prospekt{margin:9px 0 2px}
.prospektknopf{
  display:inline-block; padding:11px 18px; border-radius:11px;
  background:var(--karte); border:1px solid var(--akzent); color:var(--akzent);
  font-weight:600; font-size:16px; text-decoration:none;
}
.prospektknopf:active{opacity:.6}
.neuknopf{
  display:inline-block; margin-left:10px; padding:4px 12px; border-radius:999px;
  border:1px solid var(--linie); background:var(--karte); color:var(--grau);
  font-size:14px; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.neuknopf:active{opacity:.6}
.kein{color:var(--grau); font-size:14px}
h2{
  font-size:15px; text-transform:uppercase; letter-spacing:.07em; color:var(--grau);
  margin:26px 0 9px; padding-bottom:6px; border-bottom:1px solid var(--linie);
}
.liste{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:9px}
.karte{
  background:var(--karte); border:1px solid var(--linie); border-radius:12px;
  padding:12px 14px; display:flex; gap:12px; align-items:flex-start;
}
.karte .txt{flex:1; min-width:0}
.name{font-weight:600; margin-bottom:2px}
.zusatz{color:var(--grau); font-size:14px; overflow-wrap:anywhere}
.zeile{color:var(--grau); font-size:13px; margin-top:5px}
.markt{color:var(--text); font-weight:600}
.preisblock{text-align:right; white-space:nowrap}
.preis{font-size:21px; font-weight:700; color:var(--akzent)}
.alt{font-size:13px; color:var(--grau); text-decoration:line-through}
.spaeter{color:var(--warn); font-weight:600}
footer{color:var(--grau); font-size:13px; margin-top:40px; border-top:1px solid var(--linie); padding-top:12px}

/* Einkaufsliste */
.reiter{display:flex; gap:7px; margin:0 0 11px}
.reiter .chip{font-size:15px; padding:7px 15px}
.merk{
  flex:0 0 auto; width:38px; height:38px; border-radius:999px;
  border:1px solid var(--linie); background:var(--bg); color:var(--akzent);
  font-size:22px; font-weight:700; line-height:36px; text-align:center;
  cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
}
.merk.drauf{background:var(--akzent); border-color:var(--akzent); color:#fff}
.merk:active{opacity:.6}
.eingabe{display:flex; gap:8px; align-items:center; margin:11px 0 4px}
.eingabe #eigen{flex:1}
.zufuegen{
  flex:0 0 auto; padding:14px 18px; border-radius:12px; font-size:17px;
  font-weight:600; border:1px solid var(--akzent); background:var(--akzent);
  color:#fff; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.zufuegen:active{opacity:.6}
.punkt{
  background:var(--karte); border:1px solid var(--linie); border-radius:12px;
  padding:12px 14px; display:flex; gap:12px; align-items:center;
}
.punkt .txt{flex:1; min-width:0}
.punkt.ab .txt{opacity:.45; text-decoration:line-through}
.hak{
  flex:0 0 auto; width:30px; height:30px; border-radius:8px;
  border:2px solid var(--akzent); background:var(--bg); color:#fff;
  font-size:18px; line-height:26px; text-align:center; cursor:pointer;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.hak.an{background:var(--akzent)}
.weg{
  flex:0 0 auto; padding:6px 11px; border-radius:999px; border:1px solid var(--linie);
  background:var(--bg); color:var(--grau); font-size:15px; cursor:pointer;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.weg:active{opacity:.6}
.listenknoepfe{margin:22px 0 0; display:flex; flex-wrap:wrap; gap:8px}
.druckknopf{
  flex:0 0 auto; padding:6px 13px; border-radius:999px;
  border:1px solid var(--akzent); background:var(--karte); color:var(--akzent);
  font-size:15px; font-weight:600; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.druckknopf:active{opacity:.6}

/* Zettel zum Ausdrucken
   Das Blatt liegt im hinteren Fach rechts an. Ein A6-Zettel
   (105 x 148 mm) deckt deshalb die rechte obere Ecke des A4-Bereichs
   ab. Genau dorthin wird gedruckt.
   Safari setzt die Raender aus @page NICHT um (bekannter Fehler,
   mdn/browser-compat-data 23178). Der Zettel wird deshalb ueber den
   Textblock selbst nach rechts geschoben: 85 mm breit, rechtsbuendig.
   So bleibt links und rechts Luft, egal welchen Rand Safari selbst
   setzt. Die Hoehe begrenzt `drucke()` beim Bauen.
   Im Druckfenster A4 waehlen; A5 bietet das iPad nicht an. */
#druck{display:none}
@media print{
  @page{ size: A4 portrait; margin: 10mm; }
  html,body{ background:#fff !important; color:#000 !important;
             margin:0; padding:0; max-width:none; font-size:10pt; }
  header,#ausgabe,#listeausgabe,footer{ display:none !important }
  #druck{ display:block; width:100% }
  #druck .dzettel{ width:85mm; margin-left:auto; margin-right:0 }
  #druck .dumbruch{ height:0; break-after:page; page-break-after:always }
  #druck .dkopf{ font-size:13pt; font-weight:700; margin:0 }
  #druck .ddatum{ font-size:8pt; color:#333; margin:0 0 3mm }
  #druck .dmarkt{ font-size:10pt; font-weight:700; margin:3mm 0 1mm;
                  padding-bottom:.6mm; border-bottom:1pt solid #000;
                  break-after:avoid; page-break-after:avoid }
  #druck .dzeile{ display:flex; gap:2.5mm; align-items:flex-start;
                  padding:.9mm 0; border-bottom:.3pt dotted #999;
                  break-inside:avoid; page-break-inside:avoid }
  #druck .dkasten{ flex:0 0 auto; width:4mm; height:4mm;
                   border:.8pt solid #000; margin-top:.7mm }
  #druck .dname{ flex:1; overflow-wrap:anywhere }
  #druck .dname small{ display:block; font-size:8pt; color:#444;
                       white-space:nowrap; overflow:hidden;
                       text-overflow:ellipsis }
  #druck .dpreis{ white-space:nowrap; font-weight:700 }
}
</style>
</head>
<body>
<header>
  <h1>Angebote</h1>
  <div class="stand"><span id="stand"></span><span class="neuknopf" id="neuladen">Neu laden</span></div>
  <div class="reiter">
    <span class="chip an" id="reiterAngebote">Angebote</span>
    <span class="chip" id="reiterListe">Einkaufsliste</span>
  </div>
  <div id="teilAngebote">
    <input id="suche" type="search" placeholder="Was suchst Du? z. B. Erdbeeren" autocomplete="off" autocorrect="off">
    <div class="maerkte" id="maerkte"></div>
    <div id="prospekt"></div>
  </div>
  <div id="teilListe" style="display:none">
    <div class="eingabe">
      <input id="eigen" type="text" placeholder="Eigener Artikel, z. B. Milch" autocomplete="off" autocorrect="off">
      <span class="zufuegen" id="zufuegen">Auf die Liste</span>
    </div>
  </div>
</header>
<div id="ausgabe"></div>
<div id="listeausgabe" style="display:none"></div>
<div id="druck"></div>
<footer id="fuss"></footer>

<script>
const DATEN = /*DATEN*/;
const WT = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const heute = new Date(); heute.setHours(0,0,0,0);

function d(s){ if(!s) return null; const t=new Date(s+"T12:00:00"); return isNaN(t)?null:t; }
function schoen(s){ const t=d(s); if(!t) return "";
  return WT[t.getDay()]+", "+String(t.getDate()).padStart(2,"0")+"."+String(t.getMonth()+1).padStart(2,"0")+"."; }
function preisTxt(p){ return (typeof p==="number") ? p.toFixed(2).replace(".",",")+" €" : ""; }
function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let markt = null;
DATEN.angebote.forEach((a,i)=>{ a._i = i; });
const alleMaerkte = [...new Set(DATEN.angebote.map(a=>a.markt).concat(Object.keys(DATEN.prospekte || {})))].sort((a,b)=>a.localeCompare(b,"de"));

document.getElementById("stand").textContent =
  DATEN.angebote.length + " Angebote in " + DATEN.ort + " · Stand " + DATEN.stand;

// Neu laden: mit angehaengter Uhrzeit, sonst nimmt Safari die Seite aus
// seinem Speicher (iPad, Symbol auf dem Startbildschirm).
document.getElementById("neuladen").onclick = function(){
  location.replace(location.pathname + "?t=" + Date.now());
};

/* ---------------------------------------------------------------
   Einkaufsliste
   Liegt NUR im Speicher des Browsers (iPad: Safari). Sie geht nicht
   zu GitHub, weil die Seite oeffentlich ist. Bei einer Web-App auf
   dem Startbildschirm loescht Safari diesen Speicher nicht nach
   sieben Tagen.
   Faellt der Speicher aus (privates Fenster, Speicher voll), laeuft
   die Seite weiter; die Liste ist dann nur bis zum Neuladen da.
--------------------------------------------------------------- */
const SCHLUESSEL = "einkaufsliste";
let merkliste = ladeListe();

function ladeListe(){
  try{
    const roh = localStorage.getItem(SCHLUESSEL);
    const l = roh ? JSON.parse(roh) : [];
    return Array.isArray(l) ? l : [];
  }catch(e){ return []; }
}
function sichereListe(){
  try{ localStorage.setItem(SCHLUESSEL, JSON.stringify(merkliste)); }catch(e){}
}
function kennung(a){ return a.markt + "|" + a.name + "|" + (a.preis===undefined?"":a.preis); }
function istDrauf(id){ return merkliste.some(p=>p.id===id); }

function aufDieListe(a){
  const id = kennung(a);
  if(istDrauf(id)) return;
  merkliste.push({
    id: id, name: a.name, zusatz: a.zusatz || "", markt: a.markt,
    preis: (typeof a.preis==="number" ? a.preis : null),
    bis: a.bis || "", ab: false
  });
  sichereListe();
}
function eigenerArtikel(text){
  const t = text.trim();
  if(!t) return;
  merkliste.push({
    id: "eigen|" + Date.now() + "|" + Math.random().toString(36).slice(2,7),
    name: t, zusatz: "", markt: "", preis: null, bis: "", ab: false
  });
  sichereListe();
}
function vonDerListe(id){
  merkliste = merkliste.filter(p=>p.id!==id);
  sichereListe();
}

function zaehlerSchreiben(){
  const offen = merkliste.filter(p=>!p.ab).length;
  document.getElementById("reiterListe").textContent =
    merkliste.length ? "Einkaufsliste · " + offen : "Einkaufsliste";
}

/* ---- Umschalten zwischen Angeboten und Liste ---- */
let ansicht = "angebote";
function zeigeAnsicht(){
  const listeAn = (ansicht === "liste");
  document.getElementById("teilAngebote").style.display = listeAn ? "none" : "";
  document.getElementById("teilListe").style.display    = listeAn ? "" : "none";
  document.getElementById("ausgabe").style.display      = listeAn ? "none" : "";
  document.getElementById("listeausgabe").style.display = listeAn ? "" : "none";
  document.getElementById("reiterAngebote").className = "chip" + (listeAn ? "" : " an");
  document.getElementById("reiterListe").className    = "chip" + (listeAn ? " an" : "");
  if(listeAn) zeichneListe(); else zeichne();
}
document.getElementById("reiterAngebote").onclick = ()=>{ ansicht="angebote"; zeigeAnsicht(); };
document.getElementById("reiterListe").onclick    = ()=>{ ansicht="liste";    zeigeAnsicht(); };

document.getElementById("zufuegen").onclick = function(){
  const feld = document.getElementById("eigen");
  eigenerArtikel(feld.value);
  feld.value = "";
  zaehlerSchreiben();
  zeichneListe();
};
document.getElementById("eigen").addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); document.getElementById("zufuegen").onclick(); }
});

/* ---- Die Liste zeichnen, nach Maerkten geordnet ---- */
function zeichneListe(){
  const aus = document.getElementById("listeausgabe");
  if(!merkliste.length){
    aus.innerHTML = '<div class="hinweis">Die Liste ist leer. '
      + 'Bei jedem Angebot rechts auf + tippen, oder oben einen eigenen Artikel eintragen.</div>';
    return;
  }
  const maerkte = [...new Set(merkliste.map(p=>p.markt))]
    .sort((a,b)=>{ if(!a) return 1; if(!b) return -1; return a.localeCompare(b,"de"); });
  let html = "";
  maerkte.forEach(m=>{
    const teil = merkliste.filter(p=>p.markt===m);
    const kopf = m ? esc(m) : "Ohne Markt";
    html += '<h2>' + kopf + ' · ' + teil.length + '</h2><div class="liste">'
      + teil.map(punkt).join("") + '</div>';
  });
  html += '<div class="listenknoepfe">'
       +  '<span class="druckknopf" id="drucken">Drucken</span>'
       +  '<span class="weg" id="wegAbgehakt">Abgehakte entfernen</span>'
       +  '<span class="weg" id="wegAlles">Liste leeren</span>'
       +  '</div>';
  aus.innerHTML = html;
  document.getElementById("drucken").onclick = drucke;
  document.getElementById("wegAbgehakt").onclick = function(){
    merkliste = merkliste.filter(p=>!p.ab);
    sichereListe(); zaehlerSchreiben(); zeichneListe(); zeichne();
  };
  document.getElementById("wegAlles").onclick = function(){
    merkliste = [];
    sichereListe(); zaehlerSchreiben(); zeichneListe(); zeichne();
  };
}
function punkt(p){
  const preis = (typeof p.preis==="number") ? preisTxt(p.preis) : "";
  const bis = p.bis ? "noch bis " + schoen(p.bis) : "";
  return '<div class="punkt' + (p.ab?" ab":"") + '">'
    + '<span class="hak' + (p.ab?" an":"") + '" data-id="' + esc(p.id) + '">' + (p.ab?"✓":"") + '</span>'
    + '<div class="txt"><div class="name">' + esc(p.name) + '</div>'
    + (p.zusatz ? '<div class="zusatz">' + esc(p.zusatz) + '</div>' : '')
    + (bis ? '<div class="zeile">' + bis + '</div>' : '')
    + '</div>'
    + (preis ? '<div class="preisblock"><div class="preis">' + preis + '</div></div>' : '')
    + '<span class="weg" data-weg="' + esc(p.id) + '">×</span>'
    + '</div>';
}
/* ---- Zettel drucken ----
   Gedruckt werden nur die noch offenen Punkte, nach Märkten geordnet.
   Der Zettel ist 105 x 148 mm und liegt rechts oben auf dem A4-Bogen.
   Safari kümmert sich nicht um die Ränder aus @page, deshalb wird die
   Höhe hier beim Bauen gerechnet: Passt die nächste Zeile nicht mehr
   in die 115 mm, fängt ein neuer Zettel an. Die Werte sind gemessene
   Zeilenhöhen bei 10 pt. */
const ZETTEL_MM = 115;
function drucke(){
  const offen = merkliste.filter(p=>!p.ab);
  if(!offen.length) return;
  const t = new Date();
  const datum = String(t.getDate()).padStart(2,"0") + "."
              + String(t.getMonth()+1).padStart(2,"0") + "." + t.getFullYear();
  const maerkte = [...new Set(offen.map(p=>p.markt))]
    .sort((a,b)=>{ if(!a) return 1; if(!b) return -1; return a.localeCompare(b,"de"); });

  let zettel = [];      // fertige Zettel
  let teil = "";        // laufender Zettel
  let hoehe = 0;
  function anfangen(kopf){
    teil = '<div class="dkopf">Einkaufsliste</div>'
         + '<div class="ddatum">' + datum + ' · ' + offen.length + ' Punkte</div>';
    hoehe = 12;
    if(kopf){ teil += kopf; hoehe += 8; }
  }
  function umbrechen(kopf){ zettel.push(teil); anfangen(kopf); }
  anfangen("");

  maerkte.forEach(m=>{
    const kopf = '<div class="dmarkt">' + (m ? esc(m) : "Ohne Markt") + '</div>';
    if(hoehe + 8 + 9 > ZETTEL_MM) umbrechen(kopf);
    else { teil += kopf; hoehe += 8; }
    offen.filter(p=>p.markt===m).forEach(p=>{
      const preis = (typeof p.preis==="number") ? preisTxt(p.preis) : "";
      const zeile = '<div class="dzeile"><span class="dkasten"></span>'
        + '<span class="dname">' + esc(p.name)
        + (p.zusatz ? '<small>' + esc(p.zusatz) + '</small>' : '')
        + '</span>'
        + (preis ? '<span class="dpreis">' + preis + '</span>' : '')
        + '</div>';
      let h = 6 + (p.zusatz ? 3 : 0) + (String(p.name).length > 30 ? 4 : 0);
      if(hoehe + h > ZETTEL_MM) umbrechen(kopf + '');
      teil += zeile; hoehe += h;
    });
  });
  zettel.push(teil);

  document.getElementById("druck").innerHTML = zettel
    .map(z => '<div class="dzettel">' + z + '</div>')
    .join('<div class="dumbruch"></div>');
  window.print();
}

document.getElementById("listeausgabe").addEventListener("click", function(e){
  const hak = e.target.closest(".hak");
  if(hak){
    const p = merkliste.find(x=>x.id===hak.dataset.id);
    if(p){ p.ab = !p.ab; sichereListe(); zaehlerSchreiben(); zeichneListe(); }
    return;
  }
  const weg = e.target.closest("[data-weg]");
  if(weg){
    vonDerListe(weg.dataset.weg);
    zaehlerSchreiben(); zeichneListe(); zeichne();
  }
});

/* ---- Angebote ---- */
const PROSPEKTE = DATEN.prospekte || {};
function zeigeProspekt(){
  const p = document.getElementById("prospekt");
  if(!markt){ p.innerHTML = ""; return; }
  const u = PROSPEKTE[markt];
  p.innerHTML = u
    ? '<a class="prospektknopf" href="'+u+'" target="_blank" rel="noopener">Prospekt von '+esc(markt)+' ansehen</a>'
    : '<span class="kein">Für '+esc(markt)+' ist zurzeit kein Prospekt hinterlegt.</span>';
}

const mDiv = document.getElementById("maerkte");
function baueChips(){
  mDiv.innerHTML = "";
  const alle = document.createElement("span");
  alle.className = "chip" + (markt===null?" an":"");
  alle.textContent = "Alle Märkte";
  alle.onclick = ()=>{ markt=null; baueChips(); zeigeProspekt(); zeichne(); };
  mDiv.appendChild(alle);
  alleMaerkte.forEach(m=>{
    const c = document.createElement("span");
    c.className = "chip" + (markt===m?" an":"");
    c.textContent = m;
    c.onclick = ()=>{ markt = (markt===m?null:m); baueChips(); zeigeProspekt(); zeichne(); };
    mDiv.appendChild(c);
  });
}

function karte(a){
  const bis = d(a.bis), von = d(a.von);
  const kommt = von && von > heute;
  const drauf = istDrauf(kennung(a));
  let z = "";
  if(kommt) z = '<span class="spaeter">ab '+schoen(a.von)+'</span>' + (a.bis?" bis "+schoen(a.bis):"");
  else if(bis) z = "noch bis "+schoen(a.bis);
  return '<div class="karte"><div class="txt">'
    + '<div class="name">'+esc(a.name)+'</div>'
    + (a.zusatz?'<div class="zusatz">'+esc(a.zusatz)+'</div>':'')
    + '<div class="zeile"><span class="markt">'+esc(a.markt)+'</span>'+(z?' · '+z:'')+'</div>'
    + '</div><div class="preisblock"><div class="preis">'+preisTxt(a.preis)+'</div>'
    + (a.altpreis?'<div class="alt">'+preisTxt(a.altpreis)+'</div>':'')
    + '</div>'
    + '<span class="merk'+(drauf?' drauf':'')+'" data-i="'+a._i+'">'+(drauf?'✓':'+')+'</span>'
    + '</div>';
}

document.getElementById("ausgabe").addEventListener("click", function(e){
  const knopf = e.target.closest(".merk");
  if(!knopf) return;
  const a = DATEN.angebote[Number(knopf.dataset.i)];
  if(!a) return;
  const id = kennung(a);
  if(istDrauf(id)){ vonDerListe(id); knopf.className = "merk"; knopf.textContent = "+"; }
  else           { aufDieListe(a);   knopf.className = "merk drauf"; knopf.textContent = "✓"; }
  zaehlerSchreiben();
});

function zeichne(){
  const q = document.getElementById("suche").value.trim().toLowerCase();
  const worte = q.split(/\s+/).filter(Boolean);
  let liste = DATEN.angebote;
  if(markt) liste = liste.filter(a=>a.markt===markt);
  if(worte.length) liste = liste.filter(a=>{
    const t = (a.name+" "+a.zusatz+" "+a.gruppe).toLowerCase();
    return worte.every(w=>t.includes(w));
  });
  const aus = document.getElementById("ausgabe");
  if(!liste.length){
    const nurProspekt = markt && !DATEN.angebote.some(a=>a.markt===markt);
    aus.innerHTML = nurProspekt
      ? '<div class="hinweis">Für '+esc(markt)+' gibt es nur den Prospekt, keine einzelnen Angebote.</div>'
      : '<div class="hinweis">Dazu ist gerade nichts im Angebot.</div>';
    return;
  }
  let html = "";
  if(worte.length){
    const jetzt = liste.filter(a=>!(d(a.von)&&d(a.von)>heute));
    const spaet = liste.filter(a=>  (d(a.von)&&d(a.von)>heute));
    if(jetzt.length) html += '<h2>Gilt jetzt · '+jetzt.length+'</h2><div class="liste">'+jetzt.map(karte).join("")+'</div>';
    if(spaet.length) html += '<h2>Kommt noch · '+spaet.length+'</h2><div class="liste">'+spaet.map(karte).join("")+'</div>';
  } else {
    const gruppen = [...new Set(liste.map(a=>a.gruppe))];
    gruppen.forEach(g=>{
      const teil = liste.filter(a=>a.gruppe===g);
      html += '<h2>'+esc(g)+' · '+teil.length+'</h2><div class="liste">'+teil.map(karte).join("")+'</div>';
    });
  }
  aus.innerHTML = html;
}

document.getElementById("suche").addEventListener("input", zeichne);
document.getElementById("fuss").textContent =
  "Quellen: Lidl, Edeka, Kaufland und Marktguru. Angaben ohne Gewähr — es gilt der Aushang im Markt.";
baueChips();
zeigeProspekt();
zaehlerSchreiben();
zeichne();
</script>
